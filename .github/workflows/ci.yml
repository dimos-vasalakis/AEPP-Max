name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h localhost" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .

      - name: Add Supabase stand-ins (auth schema, API roles, default grants)
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/supabase_stub.sql
      - name: Migrate
        run: alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Migrations round-trip (down to base and back up)
        run: alembic downgrade base && alembic upgrade head

      - name: Tests
        run: pytest -q

  docker:
    name: API image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aepp-max-api backend
      - name: Smoke-test the API image as Render runs it
        run: |
          docker run -d --name api -e PORT=10000 -e ENVIRONMENT=production -p 10000:10000 aepp-max-api
          for i in $(seq 1 30); do curl -sf localhost:10000/api/v1/health && exit 0; sleep 1; done
          docker logs api; exit 1

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
